<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zahlenwerkstatt</title><style>
*{box-sizing:border-box}body{font:20px system-ui,sans-serif;background:#f2f5ef;color:#243c38;margin:0}main{max-width:950px;margin:30px auto;padding:24px;background:white;border-radius:24px;box-shadow:0 5px 25px #0001}h1,h2{text-align:center}button{font:inherit;cursor:pointer;border:2px solid #a6c5b7;background:#edf6ef;border-radius:12px;padding:12px;margin:5px;color:inherit}button:hover,button.active{background:#c4e5d2;border-color:#347b62}button:disabled{opacity:.4;cursor:default}.center{text-align:center}.cards,.slots{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:18px 0}.tile{min-width:48px;font-size:25px;font-weight:bold;background:#fff3cf;border-color:#d6ba72}.slot{flex:1;min-width:38px;max-width:100px;text-align:center}.slot button{width:100%;height:65px;margin:0;background:#e8f0fa;border-color:#9db5d4}.slot b{display:block;font-size:16px;margin-bottom:6px}.word{font-size:clamp(20px,4vw,34px);overflow-wrap:anywhere;font-weight:bold;text-align:center;margin:24px 0}.feedback{min-height:32px;font-weight:bold;text-align:center}.good{color:#237345}.bad{color:#a34b24}.muted{color:#62756e;font-size:16px}.hidden{display:none}input{font:inherit;width:100%;padding:12px;border:2px solid #a6c5b7;border-radius:10px} @media(max-width:550px){main{margin:0;padding:14px;border-radius:0}.slots{gap:3px}.slot button{padding:4px}.tile{min-width:40px;padding:8px}}

body{background:linear-gradient(120deg,#dbe6ef,#f2f6fa);color:#111;font-family:'Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;font-weight:700;min-height:100vh}main{max-width:1150px;background:transparent;box-shadow:none;margin:30px auto}h1{font-size:clamp(30px,5vw,54px);font-weight:1000}h2{font-weight:900}button{background:white;border:0;box-shadow:0 5px 15px #26394a14;color:#111;font-weight:800}button:hover,button.active{background:#397ff0;color:white}.tile{background:white;border:2px solid #c8d5e0}.word{background:white;border-radius:20px;padding:30px 12px;box-shadow:0 12px 30px #26394a12}.slots{gap:0;flex-wrap:nowrap;max-width:780px;margin:24px auto;border:3px solid black}.slot{min-width:0;max-width:none;border-right:2px solid black;background:var(--place);flex:1}.slot:last-child{border-right:0}.slot b{font-size:clamp(17px,4vw,34px);padding:12px 0;margin:0;border-bottom:5px solid black}.slot button{background:transparent;border:0;border-radius:0;box-shadow:none;height:85px;font-size:clamp(24px,5vw,42px);color:black}.slot button:hover{background:#ffffff55;color:black}.slot.split{border-right:7px solid #c90000}.menurow{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}.menurow button{min-width:175px}.muted{color:#46525c}.turn{text-align:center;font-size:24px}.homehint{text-align:center;color:#46525c} @media(max-width:550px){.slot button{height:65px}.menurow button{min-width:125px;font-size:16px}.word{padding:22px 8px}}
.menupanel{background:#ffffffb8;border-radius:22px;padding:18px 12px;margin:22px auto;box-shadow:0 8px 24px #26394a12;border:1px solid #fff}.menupanel h2{margin:4px 0 18px}.menupanel .homehint{margin:12px 0 0}.wordpart{display:inline-block}.wordpart.blue{color:#1762ae}.wordpart.red{color:#c62828}.feedback.good{font-size:28px} .word{overflow-wrap:normal}.wordpart{max-width:100%;overflow-wrap:anywhere}.audio-btn{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;width:38px;height:38px;padding:5px;margin:0 0 0 9px;border:1px solid #d3dfe9;background:#edf3fa;color:#245e9d;box-shadow:none;font-size:20px;border-radius:50%}.audio-btn:hover{background:#397ff0;color:white}</style><main id="app"></main><script>
const app=document.querySelector('#app');let partner=false;let advanceTimer=null;let range=1000,mode='build',n=0,round=0,stage=0,tiles=[],slots=[],selected=null,parts=[],chosen=[],solved=false,puzzle;const labels=['M','HT','ZT','T','H','Z','E'];const fmt=n=>n.toLocaleString('de-DE');const rand=n=>Math.floor(Math.random()*n);const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
function word(n,compound=false){let u=['null','eins','zwei','drei','vier','fünf','sechs','sieben','acht','neun'],t=['','','zwanzig','dreißig','vierzig','fünfzig','sechzig','siebzig','achtzig','neunzig'],teen=['zehn','elf','zwölf','dreizehn','vierzehn','fünfzehn','sechzehn','siebzehn','achtzehn','neunzehn'];if(n===1000000)return'eine Million';if(n>=1000)return word(Math.floor(n/1000),true)+'tausend'+(n%1000?word(n%1000):'');if(n>=100)return word(Math.floor(n/100),true)+'hundert'+(n%100?word(n%100):'');if(n>=20)return(n%10?(n%10===1?'ein':u[n%10])+'und':'')+t[Math.floor(n/10)];if(n>=10)return teen[n-10];return n===1&&compound?'ein':u[n]}
function wordBlocks(n){if(n===1000000)return ["eine Million"];let a=[];function group(v,compound=false){if(v>=100){a.push(word(Math.floor(v/100),true)+"hundert");v%=100;if(v)a.push(word(v,compound));}else if(v)a.push(word(v,compound));}if(n>=1000){group(Math.floor(n/1000),true);a.push("tausend");}group(n%1000);return a.length?a:["null"];}function coloredWord(n){return wordBlocks(n).map((w,i)=>`<span class="wordpart ${i%2?"red":"blue"}">${w}</span>`).join("");}function speakNumber(){if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){alert('Die Vorlesefunktion wird von diesem Browser leider nicht unterstützt.');return;}speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(word(n));utterance.lang='de-DE';utterance.rate=0.85;const voices=speechSynthesis.getVoices();const voice=voices.find(v=>v.lang.toLowerCase()==='de-de')||voices.find(v=>v.lang.toLowerCase().startsWith('de'));if(voice)utterance.voice=voice;utterance.onerror=e=>{if(e.error!=='canceled'&&e.error!=='interrupted')alert('Die Zahl konnte nicht vorgelesen werden. Bitte prüfe die Sprachausgabe deines Geräts.');};speechSynthesis.speak(utterance);}function stopSpeech(){if('speechSynthesis' in window)speechSynthesis.cancel();}function home(){stopSpeech();clearTimeout(advanceTimer);partner=false;app.innerHTML=`<h1>🔢 Zahlenwerkstatt 🔢</h1><h2>Was möchtest du üben?</h2><section class="menupanel"><h2>🧩 Zahlenbaumeister</h2><div class="menurow"><button onclick="launch(1000,'build')">🐯 Bis 1.000</button><button onclick="launch(1000000,'build')">🐻 Bis 1 Million</button><button onclick="launch(1000,'build',true)">🐯 🐻 Partnerarbeit</button></div><p class="homehint">Zahlen lesen, legen und zerlegen</p></section><section class="menupanel"><h2>🔎 Zahlendetektiv</h2><div class="menurow"><button onclick="launch(1000,'puzzle')">🐯 Bis 1.000</button><button onclick="launch(1000000,'puzzle')">🐻 Bis 1 Million</button></div><p class="homehint">Knifflige Zahlenrätsel lösen</p></section>`}function launch(r,m,p=false){range=r;partner=p;mode=m;round=0;next()}
function next(){stopSpeech();round++;if(partner)range=round%2?1000:1000000;stage=0;selected=null;solved=false;chosen=[];if(mode==='build'){let max=range;n=partner?(range===1000?101+rand(900):1001+rand(999000)):1+rand(max);let len=range===1000?(n===1000?4:3):(n===1000000?7:6);slots=Array(len).fill(null);let ds=String(n).padStart(len,'0').split('').map(Number);tiles=shuffle([...ds,...Array.from({length:3},()=>rand(10))]);}else{makePuzzle()}render()}
function makePuzzle(){let len=range===1000?3:((round-1)%5===3?6:4+rand(3));let sizeWord=({3:'dreistellige',4:'vierstellige',5:'fünfstellige',6:'sechsstellige'})[len];let ds=shuffle([1,2,3,4,5,6,7,8,9]).slice(0,6);let type=(round-1)%5;let test,txt;if(type===0){txt='Bilde die größte '+sizeWord+' Zahl.';test=a=>a.join('')===[...ds].sort((a,b)=>b-a).slice(0,len).join('')}else if(type===1){txt='Bilde die kleinste '+sizeWord+' Zahl.';test=a=>a.join('')===[...ds].sort((a,b)=>a-b).slice(0,len).join('')}else if(type===2){if(!ds.some(x=>x%2))ds[0]=1;txt='Bilde eine ungerade '+sizeWord+' Zahl.';test=a=>a[len-1]%2===1}else if(type===3){ds=[2,4,...shuffle([1,3,5,6,7,8,9]).slice(0,4)];txt='Bilde eine '+sizeWord+' Zahl. '+(len===3?'Die H-Stelle ist doppelt so groß wie die Z-Stelle.':'Die HT-Stelle ist doppelt so groß wie die ZT-Stelle.');test=a=>a[0]===2*a[1]}else{if(!ds.some(x=>x%2===0))ds[0]=2;txt='Bilde eine gerade '+sizeWord+' Zahl.';test=a=>a[len-1]%2===0}tiles=shuffle(ds);slots=Array(len).fill(null);puzzle={txt,test}}
function header(){return `<button onclick="home()">← Startseite</button><span class="muted"> Aufgabe ${round} · bis ${fmt(range)}</span>${partner?`<div class="turn">${range===1000?"🐯 Tiger":"🐻 Bär"} ist an der Reihe!</div>`:""}<h2>${mode==='build'?'Zahlenbaumeister':'Zahlendetektiv'}</h2>`}function board(){return `<div class="slots">${slots.map((v,i)=>`<div class="slot ${labels[7-slots.length+i]==='T'&&slots.length>4?'split':''}" style="--place:${({M:"#cce0ef",HT:"#dddec4",ZT:"#d9d0cc",T:"#cce0ef",H:"#bed9cf",Z:"#dddec4",E:"#d9d0cc"})[labels[7-slots.length+i]]}"><b>${labels[7-slots.length+i]}</b><button aria-label="${labels[7-slots.length+i]}" onclick="place(${i})" ondragover="event.preventDefault()" ondrop="event.preventDefault();selected=Number(event.dataTransfer.getData('text/plain'));place(${i})">${v===null?'–':tiles[v]}</button></div>`).join('')}</div><div class="cards">${tiles.map((v,i)=>`<button class="tile ${selected===i?'active':''}" ${slots.includes(i)?'disabled':''} draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${i}')" onclick="pick(${i})">${v}</button>`).join('')}</div>`}function pick(i){if(!solved){selected=i;render()}}function place(i){if(solved)return;if(selected!==null&&!slots.includes(selected)&&tiles[selected]!==undefined){slots[i]=selected;selected=null}else if(selected===null){slots[i]=null}render()}
function render(){let body='';if(mode==='puzzle'||stage===0){body=`<p class="center">${mode==='build'?'Lies das Zahlwort laut. Lege anschließend die Zahl.':'Du darfst jedes Kärtchen höchstens einmal verwenden.'}</p><div class="word">${mode==='build'?coloredWord(n)+'<button class="audio-btn" onclick="speakNumber()" aria-label="Zahl vorlesen" title="Zahl vorlesen">🔊</button>':puzzle.txt}</div>${board()}<p class="center muted">Kärtchen antippen und dann eine Stelle wählen – oder ziehen. Belegte Stelle antippen, um sie zu leeren.</p>`}else{body=`<p class="center">Wähle die passenden Zahlenbausteine. Die Reihenfolge ist egal.</p><div class="word">${fmt(n)} = ${chosen.map(i=>fmt(parts[i])).join(' + ')||'?'}</div><div class="cards">${parts.map((v,i)=>`<button class="tile" ${chosen.includes(i)||solved?'disabled':''} onclick="chosen.push(${i});render()">${fmt(v)}</button>`).join('')}</div><div class="center"><button onclick="chosen=[];render()" ${solved?'disabled':''}>Zerlegung löschen</button></div>`}app.innerHTML=header()+body+`<div id="feedback" class="feedback" aria-live="polite"></div><div class="center"><button onclick="check()" ${solved?'disabled':''}>Überprüfen</button></div>`}function decomposition(){return String(n).split('').map((d,i)=>Number(d)*10**(String(n).length-i-1)).filter(Boolean)}function check(){if(solved)return;let ok=false;if(mode==='build'&&stage===1){ok=chosen.map(i=>parts[i]).sort((a,b)=>a-b).join(',')===decomposition().sort((a,b)=>a-b).join(',')}else{let a=slots.map(i=>i===null?null:tiles[i]);if(mode==='build'){ok=a.every((v,i)=>v===Number(String(n).padStart(slots.length,'0')[i])||(v===null&&i<slots.length-String(n).length))}else ok=a.every(v=>v!==null)&&puzzle.test(a)}if(ok){solved=true;render()}let f=document.querySelector('#feedback');f.className='feedback '+(ok?'good':'bad');f.textContent=ok?'👍 Richtig!':'Noch nicht ganz richtig. Versuche es noch einmal.';if(ok)advanceTimer=setTimeout(advance,1100)}function advance(){stopSpeech();clearTimeout(advanceTimer);if(!solved)return;if(mode==='build'&&stage===0){stage=1;solved=false;let correct=decomposition();let wrong=[];for(let i=0;i<slots.length;i++){let v=(1+rand(9))*10**i;if(!correct.includes(v))wrong.push(v)}parts=shuffle([...new Set([...correct,...wrong,0])]);chosen=[];render()}else next()}home();
</script></html>
